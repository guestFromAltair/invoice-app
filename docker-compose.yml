version: '3.8'

services:
  # PostgreSQL database
  # NOTE: Using default credentials for demo/local development purposes only.
  postgres:
    image: postgres:16-alpine
    container_name: invoiceapp-postgres
    environment:
      POSTGRES_DB: ${DB_NAME:-invoiceapp}
      POSTGRES_USER: ${DB_USER:-invoiceapp}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-invoiceapp}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Spring Boot backend
  backend:
    build:
      context: ./invoice-app-backend
    container_name: invoiceapp-backend
    ports:
      - "8080:8080"
      - "5005:5005" # Debug port
    environment:
      SPRING_PROFILES_ACTIVE: dev
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${DB_NAME:-invoiceapp}
      SPRING_DATASOURCE_USERNAME: ${DB_USER:-invoiceapp}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:-invoiceapp}
      APPLICATION_SECURITY_JWT_SECRET_KEY: ${JWT_SECRET}
      SPRING_JPA_HIBERNATE_DDL_AUTO: validate
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      SPRING_DATA_REDIS_HOST: redis
      # JVM waits for a debugger on port 5005
      JAVA_TOOL_OPTIONS: "-agentlib:jdwp=transport=dt_socket,server=y,suspend=n,address=*:5005"
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      redis:
        condition: service_healthy

  prometheus:
    image: prom/prometheus:v2.51.0
    container_name: invoiceapp-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=15d'
      - '--web.enable-lifecycle'
    depends_on:
      backend:
        condition: service_started

  grafana:
    image: grafana/grafana:10.4.0
    container_name: invoiceapp-grafana
    ports:
      - "3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
    depends_on:
      - prometheus

  # Kafka broker
  kafka:
    image: apache/kafka:3.8.1
    container_name: invoiceapp-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:29092,CONTROLLER://0.0.0.0:9093,PLAINTEXT_HOST://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 5

  # Kafka: web UI
  kafka-ui:
    image: kafbat/kafka-ui:latest
    container_name: invoiceapp-kafka-ui
    ports:
      - "8081:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
      DYNAMIC_CONFIG_ENABLED: "true"
    depends_on:
      kafka:
        condition: service_healthy
  # Redis
  redis:
    image: redis:7-alpine
    container_name: invoiceapp-redis
    ports:
      - "6379:6379"
    command: [ "redis-server", "--maxmemory-policy", "noeviction", "--appendonly", "no" ]
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5

  # Delivery service
  delivery-db:
    image: postgres:16-alpine
    container_name: invoiceapp-delivery-db
    environment:
      POSTGRES_DB: delivery
      POSTGRES_USER: delivery
      POSTGRES_PASSWORD: delivery
    ports:
      - "5433:5432"
    volumes:
      - delivery_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U delivery" ]
      interval: 10s
      timeout: 5s
      retries: 5

  delivery:
    build:
      context: ./invoice-app-delivery
    container_name: invoiceapp-delivery
    ports:
      - "8082:8082"
      - "5006:5005" # Debug port
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://delivery-db:5432/delivery
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      # JVM waits for a debugger on port 5005
      JAVA_TOOL_OPTIONS: "-agentlib:jdwp=transport=dt_socket,server=y,suspend=n,address=*:5005"
    depends_on:
      delivery-db:
        condition: service_healthy
      kafka:
        condition: service_healthy

# Named volumes
volumes:
  postgres_data:
  delivery_data:
  prometheus_data:
  grafana_data: