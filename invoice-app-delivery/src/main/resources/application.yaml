spring:
  application:
    name: invoice-delivery

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/delivery}
    username: ${SPRING_DATASOURCE_USERNAME:delivery}
    password: ${SPRING_DATASOURCE_PASSWORD:delivery}

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: invoice-delivery
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      auto-offset-reset: earliest
      enable-auto-commit: false

server:
  port: 8082

management:
  endpoints:
    web:
      exposure:
        include: health, info