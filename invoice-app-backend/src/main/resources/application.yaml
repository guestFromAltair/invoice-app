spring:
  application:
    name: invoice-app-backend

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/invoiceapp}
    username: ${SPRING_DATASOURCE_USERNAME:invoiceapp}
    password: ${SPRING_DATASOURCE_PASSWORD:invoiceapp}
    driver-class-name: org.postgresql.Driver
    hikari:
      leak-detection-threshold: 2000

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
    open-in-view: false

  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
      properties:
        enable.idempotence: true
    consumer:
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      auto-offset-reset: latest
      enable-auto-commit: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: 6379
      timeout: 200ms

  profiles:
    active: dev

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health, info, prometheus
  endpoint:
    health:
      show-details: when-authorized
    prometheus:
      enabled: true
  metrics:
    tags:
      application: invoice-app
    distribution:
      percentiles-histogram:
        http:
          server:
            requests: true

application:
  cors:
    allowed-origins: http://localhost:5173,http://localhost:3000
  security:
    jwt:
      secret-key: ${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
      expiration: 86400000
  kafka:
    topic:
      invoice-events: invoice.events
    consumer:
      sse-group-prefix: invoice-sse
      processed-retention-days: 7
  outbox:
    retention-days: 7
    relay:
      poll-interval-ms: 1000
      batch-size: 100
  idempotency:
    ttl-seconds: 86400
    abandoned-after-seconds: 300
  rate-limit:
    capacity: 60
    refill-per-second: 1

springdoc:
  api-docs:
    enabled: true
    path: /v3/api-docs
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
    try-it-out-enabled: true

---
# ===================================================================
# DEVELOPMENT PROFILE ONLY
# ===================================================================
spring:
  config:
    activate:
      on-profile: dev

  jpa:
    show-sql: true

logging:
  level:
    org.hibernate.orm.jdbc.bind: trace