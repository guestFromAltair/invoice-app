spring:
  application:
    name: invoice-app-backend

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/invoiceapp}
    username: ${SPRING_DATASOURCE_USERNAME:invoiceapp}
    password: ${SPRING_DATASOURCE_PASSWORD:invoiceapp}
    driver-class-name: org.postgresql.Driver
    hikari:
      leak-detection-threshold: 2000

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  profiles:
    active: dev

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health, info, prometheus
  endpoint:
    health:
      show-details: when-authorized
    prometheus:
      enabled: true
  metrics:
    tags:
      application: invoice-app
    distribution:
      percentiles-histogram:
        http:
          server:
            requests: true

application:
  cors:
    allowed-origins: http://localhost:5173,http://localhost:3000
  security:
    jwt:
      secret-key: ${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
      expiration: 86400000

---
# ===================================================================
# DEVELOPMENT PROFILE ONLY
# ===================================================================
spring:
  config:
    activate:
      on-profile: dev

  jpa:
    show-sql: true

logging:
  level:
    org.hibernate.orm.jdbc.bind: trace